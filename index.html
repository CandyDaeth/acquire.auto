<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <title>Acquire 타일 시세</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --line: #2c3948;
      --text: #f4f7fb;
      --muted: #9aa8b8;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Pretendard", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, #243044 0%, transparent 40%),
        linear-gradient(160deg, #0c1116, #151c24 55%, #0f1419);
      color: var(--text);
    }

    .wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px));
    }

    h1 {
      font-size: clamp(1.3rem, 2.4vw, 1.8rem);
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .sub {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 22px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px 18px 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 250px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 6px;
      background: var(--accent);
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding-top: 4px;
    }

    .name {
      font-size: clamp(1.15rem, 2vw, 1.45rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }

    .clear-btn {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: #243040;
      color: var(--text);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .clear-btn:hover { background: #314155; }
    .clear-btn:active { transform: translateY(1px); }

    .stepper {
      display: grid;
      grid-template-columns: 56px 1fr 56px;
      gap: 8px;
      align-items: center;
    }

    .stepper button {
      height: 52px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: var(--on-accent, #fff);
      font-size: 1.6rem;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
    }

    .stepper button:hover { filter: brightness(1.08); }

    .stepper input[type="number"] {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #12181f;
      color: var(--text);
      text-align: center;
      font-size: 1.45rem;
      font-weight: 800;
      -moz-appearance: textfield;
    }

    .stepper input::-webkit-outer-spin-button,
    .stepper input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-top: auto;
    }

    .metric-trio { display: contents; }

    .metric {
      background: #12181f;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 4px 9px;
      text-align: center;
      min-width: 0;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 0.68rem;
      margin-bottom: 6px;
      white-space: nowrap;
    }

    .metric strong {
      display: block;
      font-size: 0.9rem;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .stable-badge {
      display: none;
      flex: 0 0 auto;
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .card.safe .stable-badge { display: inline-block; }

    .found-msg { display: none; }

    .card.empty { cursor: pointer; }
    .card.empty .clear-btn,
    .card.empty .stepper,
    .card.empty .metrics { display: none; }
    .card.empty .found-msg {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }
    .card.empty:hover { border-color: var(--accent); }

    .card.safe {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 5px var(--accent), var(--shadow);
    }
    .card.safe::before { display: none; }
    .card.safe .clear-btn { display: none; }

    .log {
      margin-top: 24px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 16px 14px;
      box-shadow: var(--shadow);
    }

    .log-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .log-hint {
      color: var(--muted);
      font-size: 0.8rem;
      margin: 4px 0 12px;
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 320px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .log-row {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 2px 12px;
      text-align: left;
      width: 100%;
      background: #12181f;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--text);
      cursor: pointer;
      font: inherit;
    }

    .log-row:hover { background: #18212b; }

    .log-row.current {
      border-color: #7aa7ff;
      background: #17233a;
    }

    .log-time {
      grid-row: 1 / span 2;
      align-self: center;
      color: var(--muted);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .log-msg { font-size: 0.92rem; font-weight: 700; }

    .log-snap {
      color: var(--muted);
      font-size: 0.75rem;
      overflow-wrap: anywhere;
    }

    .log-empty {
      color: var(--muted);
      font-size: 0.85rem;
      padding: 8px 2px;
    }

    @media (max-width: 1024px) {
      .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric strong { font-size: 1.05rem; }
      .metric span { font-size: 0.75rem; }
    }

    @media (max-width: 640px) {
      .board { grid-template-columns: 1fr; }
      .wrap { padding: calc(16px + env(safe-area-inset-top, 0px)) 12px calc(28px + env(safe-area-inset-bottom, 0px)); }
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(6, 9, 13, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }

    .modal-overlay[hidden] { display: none; }

    .modal {
      width: 100%;
      max-width: 380px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .modal-sub {
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 16px;
    }

    .modal-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      border: 1px solid var(--line);
      background: #12181f;
      color: var(--text);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-option:hover { filter: brightness(1.15); }

    .modal-option .swatch {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--dot, #64748b);
      margin-right: 10px;
    }

    .modal-option .tiles-count {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
    }

    .modal-cancel {
      margin-top: 14px;
      width: 100%;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 12px;
      padding: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-cancel:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Acquire 타일 시세</h1>

    <section class="log" aria-label="log">

      <p class="log-hint">기록을 누르면 해당 시점의 상태로 불러옵니다.</p>
      <div class="log-list" id="logList"></div>
    </section>
  </div>

  <div class="modal-overlay" id="mergeModal" hidden>
    <div class="modal">

      <p class="modal-sub">타일을 넘겨줄 기업을 선택하세요.</p>
      <div class="modal-list" id="mergeList"></div>
      <button type="button" class="modal-cancel" id="mergeCancel">취소</button>
    </div>
  </div>

            <div class="stepper">
              <button type="button" data-action="minus" aria-label="타일 감소">-</button>
              <input type="number" min="${MIN_TILE}" max="${MAX_TILE}" value="0" inputmode="numeric" />
              <button type="button" data-action="plus" aria-label="타일 증가">+</button>
            </div>
            <div class="metrics">
              <div class="metric metric-price">
                <span>주식 가격</span>
                <strong data-role="price">0</strong>
              </div>
              <div class="metric-trio">
                <div class="metric">
                  <span>최대주주</span>
                  <strong data-role="bonus">0</strong>
                </div>
                <div class="metric">
                  <span>2대주주</span>
                  <strong data-role="bonus2">0</strong>
                </div>
                <div class="metric">
                  <span>3대주주</span>
                  <strong data-role="bonus3">0</strong>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join("");

      board.querySelectorAll(".card").forEach((card) => bindCard(card));
    }

    function clamp(n) {
      if (Number.isNaN(n)) return 0;
      return Math.min(MAX_TILE, Math.max(MIN_TILE, n));
    }

    function updateCard(card, tiles) {
      const col = Number(card.dataset.col);
      const input = card.querySelector("input");
      input.value = String(tiles);
      card.classList.toggle("empty", tiles === 0);
      card.classList.toggle("safe", tiles >= 11);
      card.querySelector('[data-role="price"]').textContent = money(lookup(SHEET.price, tiles, col));
      card.querySelector('[data-role="bonus"]').textContent = money(lookup(SHEET.bonus, tiles, col));
      card.querySelector('[data-role="bonus2"]').textContent = money(lookup(SHEET.bonus2, tiles, col));
      card.querySelector('[data-role="bonus3"]').textContent = money(lookup(SHEET.bonus3, tiles, col));
    }

    function getTiles(card) {
      return clamp(parseInt(card.querySelector("input").value, 10));
    }

    const STORAGE_KEY = "acquire-tile-state-v1";
    const MAX_LOG = 500;
    let logEntries = [];
    let currentLogId = null;
    let logSeq = 0;
    let lastSnap = SHEET.companies.map(() => 0);

    function cardByCol(col) {
      return document.querySelector(`.card[data-col="${col}"]`);
    }

    function snapshot() {
      return SHEET.companies.map((_, i) => getTiles(cardByCol(i)));
    }

    function applyState(tiles) {
      tiles.forEach((t, i) => updateCard(cardByCol(i), clamp(Number(t) || 0)));
      lastSnap = snapshot();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          tiles: snapshot(),
          log: logEntries,
          current: currentLogId,
          seq: logSeq
        }));
      } catch (e) { /* 저장 불가 환경이면 무시 */ }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        const d = JSON.parse(raw);
        if (!d || !Array.isArray(d.tiles) || d.tiles.length !== SHEET.companies.length) return false;
        logEntries = (Array.isArray(d.log) ? d.log : []).filter((e) =>
          e && typeof e.msg === "string" && Array.isArray(e.tiles) && e.tiles.length === SHEET.companies.length
        );
        logSeq = Math.max(Number(d.seq) || 0, ...logEntries.map((e) => Number(e.id) || 0));
        currentLogId = d.current;
        applyState(d.tiles);
        return true;
      } catch (e) {
        return false;
      }
    }

    function commit(msg) {
      lastSnap = snapshot();
      const entry = { id: ++logSeq, time: Date.now(), msg, tiles: lastSnap.slice() };
      logEntries.push(entry);
      if (logEntries.length > MAX_LOG) logEntries.shift();
      currentLogId = entry.id;
      saveState();
      renderLog();
    }

    function renderLog() {
      const list = document.getElementById("logList");
      list.innerHTML = "";
      if (!logEntries.length) {
        const empty = document.createElement("p");
        empty.className = "log-empty";
        empty.textContent = "기록이 없습니다.";
        list.appendChild(empty);
        return;
      }
      logEntries.slice().reverse().forEach((e) => {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "log-row" + (e.id === currentLogId ? " current" : "");
        row.dataset.id = String(e.id);

        const time = document.createElement("span");
        time.className = "log-time";
        time.textContent = new Date(e.time).toLocaleString("ko-KR", {
          month: "numeric", day: "numeric",
          hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
        });

        const msg = document.createElement("span");
        msg.className = "log-msg";
        msg.textContent = e.msg;

        const snap = document.createElement("span");
        snap.className = "log-snap";
        const parts = SHEET.companies
          .map((name, i) => (e.tiles[i] > 0 ? `${name} ${e.tiles[i]}` : ""))
          .filter(Boolean);
        snap.textContent = parts.length ? parts.join(" · ") : "전체 0";

        row.append(time, msg, snap);
        list.appendChild(row);
      });
    }

    document.getElementById("logList").addEventListener("click", (event) => {
      const row = event.target.closest(".log-row");
      if (!row) return;
      const entry = logEntries.find((e) => String(e.id) === row.dataset.id);
      if (!entry) return;
      closeMergeModal();
      applyState(entry.tiles);
      currentLogId = entry.id;
      saveState();
      renderLog();
    });

    function bindCard(card) {
      const input = card.querySelector("input");
      const col = Number(card.dataset.col);
      const name = SHEET.companies[col];
      updateCard(card, 0);

      function commitTileChange() {
        const before = lastSnap[col];
        const after = getTiles(card);
        if (before === after) return;
        commit(before === 0 ? `${name} 기업설립 (0 → ${after})` : `${name} 타일 ${before} → ${after}`);
      }

      card.addEventListener("click", (event) => {
        const action = event.target.dataset.action;
        if (card.classList.contains("empty")) {
          updateCard(card, 2);
          commitTileChange();
          return;
        }
        if (!action) return;
        if (action === "merge") {
          openMergeModal(card);
          return;
        }
        let tiles = clamp(parseInt(input.value, 10));
        if (action === "plus") tiles += (tiles === 0 ? 2 : 1);
        if (action === "minus") tiles -= 1;
        updateCard(card, clamp(tiles));
        commitTileChange();
      });

      input.addEventListener("input", () => {
        updateCard(card, clamp(parseInt(input.value, 10)));
        saveState();
      });

      input.addEventListener("change", commitTileChange);
    }

    const mergeModal = document.getElementById("mergeModal");
    const mergeList = document.getElementById("mergeList");
    const mergeCancel = document.getElementById("mergeCancel");
    let mergeSourceCard = null;

    function closeMergeModal() {
      mergeModal.hidden = true;
      mergeSourceCard = null;
      mergeList.innerHTML = "";
    }

    function openMergeModal(sourceCard) {
      mergeSourceCard = sourceCard;
      const sourceCol = Number(sourceCard.dataset.col);
      const sourceTiles = getTiles(sourceCard);
      const otherCards = Array.from(document.querySelectorAll(".card"))
        .filter((c) => Number(c.dataset.col) !== sourceCol)
        .filter((c) => getTiles(c) >= sourceTiles);

      mergeList.innerHTML = otherCards.length ? otherCards.map((c) => {
        const name = c.querySelector(".name").textContent;
        const accent = c.style.getPropertyValue("--accent") || "#64748b";
        const tiles = getTiles(c);
        return `
          <button type="button" class="modal-option" data-target-col="${c.dataset.col}">
            <span><span class="swatch" style="--dot:${accent}"></span>${name}</span>
            <span class="tiles-count">${tiles}칸</span>
          </button>
        `;
      }).join("") : `<p class="modal-sub" style="margin:0;">합병 가능한(타일 수가 같거나 많은) 기업이 없습니다.</p>`;

      mergeModal.hidden = false;
    }

    mergeList.addEventListener("click", (event) => {
      const btn = event.target.closest(".modal-option");
      if (!btn || !mergeSourceCard) return;
      const targetCol = btn.dataset.targetCol;
      const targetCard = document.querySelector(`.card[data-col="${targetCol}"]`);
      if (!targetCard) return;

      const sourceTiles = getTiles(mergeSourceCard);
      const targetTiles = getTiles(targetCard);

      const srcName = mergeSourceCard.querySelector(".name").textContent;
      const tgtName = targetCard.querySelector(".name").textContent;
      const merged = clamp(targetTiles + sourceTiles);

      updateCard(targetCard, merged);
      updateCard(mergeSourceCard, 0);

      closeMergeModal();
      commit(`합병: ${srcName}(${sourceTiles}) → ${tgtName}(${targetTiles}) = ${merged}`);
    });

    mergeCancel.addEventListener("click", closeMergeModal);
    mergeModal.addEventListener("click", (event) => {
      if (event.target === mergeModal) closeMergeModal();
    });

    render();
    if (!loadState()) commit("시작 (전체 타일 0)");
    else renderLog();
  </script>
</body>
</html>
