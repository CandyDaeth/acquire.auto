<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <title>Acquire 타일 시세</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --line: #2c3948;
      --text: #f4f7fb;
      --muted: #9aa8b8;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Pretendard", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, #243044 0%, transparent 40%),
        linear-gradient(160deg, #0c1116, #151c24 55%, #0f1419);
      color: var(--text);
    }

    .wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px));
    }

    h1 {
      font-size: clamp(1.3rem, 2.4vw, 1.8rem);
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .sub {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 22px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px 18px 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 250px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 6px;
      background: var(--accent);
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding-top: 4px;
    }

    .name {
      font-size: clamp(1.15rem, 2vw, 1.45rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }

    .clear-btn {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: #243040;
      color: var(--text);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .clear-btn:hover { background: #314155; }
    .clear-btn:active { transform: translateY(1px); }

    .stepper {
      display: grid;
      grid-template-columns: 56px 1fr 56px;
      gap: 8px;
      align-items: center;
    }

    .stepper button {
      height: 52px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: var(--on-accent, #fff);
      font-size: 1.6rem;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
    }

    .stepper button:hover { filter: brightness(1.08); }

    .stepper input[type="number"] {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #12181f;
      color: var(--text);
      text-align: center;
      font-size: 1.45rem;
      font-weight: 800;
      -moz-appearance: textfield;
    }

    .stepper input::-webkit-outer-spin-button,
    .stepper input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: auto;
    }

    .metric {
      background: #12181f;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 12px 10px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 0.75rem;
      margin-bottom: 6px;
    }

    .metric strong {
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 1024px) {
      .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .board { grid-template-columns: 1fr; }
      .wrap { padding: calc(16px + env(safe-area-inset-top, 0px)) 12px calc(28px + env(safe-area-inset-bottom, 0px)); }
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(6, 9, 13, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }

    .modal-overlay[hidden] { display: none; }

    .modal {
      width: 100%;
      max-width: 380px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .modal-sub {
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 16px;
    }

    .modal-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      border: 1px solid var(--line);
      background: #12181f;
      color: var(--text);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-option:hover { filter: brightness(1.15); }

    .modal-option .swatch {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--dot, #64748b);
      margin-right: 10px;
    }

    .modal-option .tiles-count {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
    }

    .modal-cancel {
      margin-top: 14px;
      width: 100%;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 12px;
      padding: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-cancel:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Acquire 타일 시세</h1>
    <p class="sub">타일 수를 입력하면 주식 가격과 주주 보너스가 갱신됩니다.</p>
    <section class="board" id="board"></section>
  </div>

  <div class="modal-overlay" id="mergeModal" hidden>
    <div class="modal">
      <p class="modal-title">합병 시키기</p>
      <p class="modal-sub">타일을 넘겨줄 기업을 선택하세요.</p>
      <div class="modal-list" id="mergeList"></div>
      <button type="button" class="modal-cancel" id="mergeCancel">취소</button>
    </div>
  </div>

  <script>
    const SHEET = {
      companies: ["LG", "kakao", "HYUNDAI", "NAVER", "posco", "SAMSUNG", "SK hynix"],
      price: {"0":[0,0,0,0,0,0,0],"2":[200,200,300,300,300,400,400],"3":[300,300,400,400,400,500,500],"4":[400,400,500,500,500,600,600],"5":[500,500,600,600,600,700,700],"6":[600,600,700,700,700,800,800],"7":[600,600,700,700,700,800,800],"8":[600,600,700,700,700,800,800],"9":[600,600,700,700,700,800,800],"10":[600,600,700,700,700,800,800],"11":[700,700,800,800,800,900,900],"12":[700,700,800,800,800,900,900],"13":[700,700,800,800,800,900,900],"14":[700,700,800,800,800,900,900],"15":[700,700,800,800,800,900,900],"16":[700,700,800,800,800,900,900],"17":[700,700,800,800,800,900,900],"18":[700,700,800,800,800,900,900],"19":[700,700,800,800,800,900,900],"20":[700,700,800,800,800,900,900],"21":[800,800,900,900,900,1000,1000],"22":[800,800,900,900,900,1000,1000],"23":[800,800,900,900,900,1000,1000],"24":[800,800,900,900,900,1000,1000],"25":[800,800,900,900,900,1000,1000],"26":[800,800,900,900,900,1000,1000],"27":[800,800,900,900,900,1000,1000],"28":[800,800,900,900,900,1000,1000],"29":[800,800,900,900,900,1000,1000],"30":[800,800,900,900,900,1000,1000],"31":[900,900,1000,1000,1000,1100,1100],"32":[900,900,1000,1000,1000,1100,1100],"33":[900,900,1000,1000,1000,1100,1100],"34":[900,900,1000,1000,1000,1100,1100],"35":[900,900,1000,1000,1000,1100,1100],"36":[900,900,1000,1000,1000,1100,1100],"37":[900,900,1000,1000,1000,1100,1100],"38":[900,900,1000,1000,1000,1100,1100],"39":[900,900,1000,1000,1000,1100,1100],"40":[900,900,1000,1000,1000,1100,1100],"41":[1000,1000,1100,1100,1100,1200,1200],"42":[1000,1000,1100,1100,1100,1200,1200],"43":[1000,1000,1100,1100,1100,1200,1200],"44":[1000,1000,1100,1100,1100,1200,1200],"45":[1000,1000,1100,1100,1100,1200,1200],"46":[1000,1000,1100,1100,1100,1200,1200],"47":[1000,1000,1100,1100,1100,1200,1200],"48":[1000,1000,1100,1100,1100,1200,1200],"49":[1000,1000,1100,1100,1100,1200,1200],"50":[1000,1000,1100,1100,1100,1200,1200],"51":[1000,1000,1100,1100,1100,1200,1200],"52":[1000,1000,1100,1100,1100,1200,1200],"53":[1000,1000,1100,1100,1100,1200,1200],"54":[1000,1000,1100,1100,1100,1200,1200],"55":[1000,1000,1100,1100,1100,1200,1200],"56":[1000,1000,1100,1100,1100,1200,1200],"57":[1000,1000,1100,1100,1100,1200,1200],"58":[1000,1000,1100,1100,1100,1200,1200],"59":[1000,1000,1100,1100,1100,1200,1200],"60":[1000,1000,1100,1100,1100,1200,1200]},
      bonus: {"0":[0,0,0,0,0,0,0],"2":[1000,1000,1500,1500,1500,2000,2000],"3":[1500,1500,2000,2000,2000,2500,2500],"4":[2000,2000,2500,2500,2500,3000,3000],"5":[2500,2500,3000,3000,3000,3500,3500],"6":[3000,3000,3500,3500,3500,4000,4000],"7":[3000,3000,3500,3500,3500,4000,4000],"8":[3000,3000,3500,3500,3500,4000,4000],"9":[3000,3000,3500,3500,3500,4000,4000],"10":[3000,3000,3500,3500,3500,4000,4000],"11":[3500,3500,4000,4000,4000,4500,4500],"12":[3500,3500,4000,4000,4000,4500,4500],"13":[3500,3500,4000,4000,4000,4500,4500],"14":[3500,3500,4000,4000,4000,4500,4500],"15":[3500,3500,4000,4000,4000,4500,4500],"16":[3500,3500,4000,4000,4000,4500,4500],"17":[3500,3500,4000,4000,4000,4500,4500],"18":[3500,3500,4000,4000,4000,4500,4500],"19":[3500,3500,4000,4000,4000,4500,4500],"20":[3500,3500,4000,4000,4000,4500,4500],"21":[4000,4000,4500,4500,4500,5000,5000],"22":[4000,4000,4500,4500,4500,5000,5000],"23":[4000,4000,4500,4500,4500,5000,5000],"24":[4000,4000,4500,4500,4500,5000,5000],"25":[4000,4000,4500,4500,4500,5000,5000],"26":[4000,4000,4500,4500,4500,5000,5000],"27":[4000,4000,4500,4500,4500,5000,5000],"28":[4000,4000,4500,4500,4500,5000,5000],"29":[4000,4000,4500,4500,4500,5000,5000],"30":[4000,4000,4500,4500,4500,5000,5000],"31":[4500,4500,5000,5000,5000,5500,5500],"32":[4500,4500,5000,5000,5000,5500,5500],"33":[4500,4500,5000,5000,5000,5500,5500],"34":[4500,4500,5000,5000,5000,5500,5500],"35":[4500,4500,5000,5000,5000,5500,5500],"36":[4500,4500,5000,5000,5000,5500,5500],"37":[4500,4500,5000,5000,5000,5500,5500],"38":[4500,4500,5000,5000,5000,5500,5500],"39":[4500,4500,5000,5000,5000,5500,5500],"40":[4500,4500,5000,5000,5000,5500,5500],"41":[5000,5000,5500,5500,5500,6000,6000],"42":[5000,5000,5500,5500,5500,6000,6000],"43":[5000,5000,5500,5500,5500,6000,6000],"44":[5000,5000,5500,5500,5500,6000,6000],"45":[5000,5000,5500,5500,5500,6000,6000],"46":[5000,5000,5500,5500,5500,6000,6000],"47":[5000,5000,5500,5500,5500,6000,6000],"48":[5000,5000,5500,5500,5500,6000,6000],"49":[5000,5000,5500,5500,5500,6000,6000],"50":[5000,5000,5500,5500,5500,6000,6000],"51":[5000,5000,5500,5500,5500,6000,6000],"52":[5000,5000,5500,5500,5500,6000,6000],"53":[5000,5000,5500,5500,5500,6000,6000],"54":[5000,5000,5500,5500,5500,6000,6000],"55":[5000,5000,5500,5500,5500,6000,6000],"56":[5000,5000,5500,5500,5500,6000,6000],"57":[5000,5000,5500,5500,5500,6000,6000],"58":[5000,5000,5500,5500,5500,6000,6000],"59":[5000,5000,5500,5500,5500,6000,6000],"60":[5000,5000,5500,5500,5500,6000,6000]}
    };

    const THEMES = {
      "SK hynix": { accent: "#ff8d30", on: "#fff" },
      SAMSUNG: { accent: "#99c0ff", on: "#001029" },
      posco: { accent: "#8e49d0", on: "#1a1304" },
      NAVER: { accent: "#34b15b", on: "#05210f" },
      HYUNDAI: { accent: "#0656cf", on: "#fff" },
      kakao: { accent: "#eed924", on: "#2a2200" },
      LG: { accent: "#ff205e", on: "#3b0711" }
    };

    const MIN_TILE = 0;
    const MAX_TILE = 60;

    function money(n) {
      return Number(n || 0).toLocaleString("ko-KR");
    }

    function lookup(table, tiles, colIndex) {
      const key = String(tiles);
      if (table[key]) return table[key][colIndex] || 0;
      if (tiles > MAX_TILE) return table[String(MAX_TILE)][colIndex] || 0;
      return 0;
    }

    function render() {
      const board = document.getElementById("board");
      const companies = SHEET.companies.slice().reverse();

      board.innerHTML = companies.map((name) => {
        const originalIndex = SHEET.companies.indexOf(name);
        const theme = THEMES[name] || { accent: "#64748b", on: "#fff" };
        return `
          <article class="card" data-col="${originalIndex}" style="--accent:${theme.accent}; --on-accent:${theme.on}">
            <div class="card-head">
              <h2 class="name">${name}</h2>
              <button type="button" class="clear-btn" data-action="merge">합병 시키기</button>
            </div>
            <div class="stepper">
              <button type="button" data-action="minus" aria-label="타일 감소">-</button>
              <input type="number" min="${MIN_TILE}" max="${MAX_TILE}" value="0" inputmode="numeric" />
              <button type="button" data-action="plus" aria-label="타일 증가">+</button>
            </div>
            <div class="metrics">
              <div class="metric">
                <span>주식 가격</span>
                <strong data-role="price">0</strong>
              </div>
              <div class="metric">
                <span>주주 보너스</span>
                <strong data-role="bonus">0</strong>
              </div>
            </div>
          </article>
        `;
      }).join("");

      board.querySelectorAll(".card").forEach((card) => bindCard(card));
    }

    function clamp(n) {
      if (Number.isNaN(n)) return 0;
      return Math.min(MAX_TILE, Math.max(MIN_TILE, n));
    }

    function updateCard(card, tiles) {
      const col = Number(card.dataset.col);
      const input = card.querySelector("input");
      input.value = String(tiles);
      card.querySelector('[data-role="price"]').textContent = money(lookup(SHEET.price, tiles, col));
      card.querySelector('[data-role="bonus"]').textContent = money(lookup(SHEET.bonus, tiles, col));
    }

    function getTiles(card) {
      return clamp(parseInt(card.querySelector("input").value, 10));
    }

    function bindCard(card) {
      const input = card.querySelector("input");
      updateCard(card, 0);

      card.addEventListener("click", (event) => {
        const action = event.target.dataset.action;
        if (!action) return;
        if (action === "merge") {
          openMergeModal(card);
          return;
        }
        let tiles = clamp(parseInt(input.value, 10));
        if (action === "plus") tiles += (tiles === 0 ? 2 : 1);
        if (action === "minus") tiles -= 1;
        updateCard(card, clamp(tiles));
      });

      input.addEventListener("input", () => {
        updateCard(card, clamp(parseInt(input.value, 10)));
      });
    }

    const mergeModal = document.getElementById("mergeModal");
    const mergeList = document.getElementById("mergeList");
    const mergeCancel = document.getElementById("mergeCancel");
    let mergeSourceCard = null;

    function closeMergeModal() {
      mergeModal.hidden = true;
      mergeSourceCard = null;
      mergeList.innerHTML = "";
    }

    function openMergeModal(sourceCard) {
      mergeSourceCard = sourceCard;
      const sourceCol = Number(sourceCard.dataset.col);
      const sourceTiles = getTiles(sourceCard);
      const otherCards = Array.from(document.querySelectorAll(".card"))
        .filter((c) => Number(c.dataset.col) !== sourceCol)
        .filter((c) => getTiles(c) >= sourceTiles);

      mergeList.innerHTML = otherCards.length ? otherCards.map((c) => {
        const name = c.querySelector(".name").textContent;
        const accent = c.style.getPropertyValue("--accent") || "#64748b";
        const tiles = getTiles(c);
        return `
          <button type="button" class="modal-option" data-target-col="${c.dataset.col}">
            <span><span class="swatch" style="--dot:${accent}"></span>${name}</span>
            <span class="tiles-count">${tiles}칸</span>
          </button>
        `;
      }).join("") : `<p class="modal-sub" style="margin:0;">합병 가능한(타일 수가 같거나 많은) 기업이 없습니다.</p>`;

      mergeModal.hidden = false;
    }

    mergeList.addEventListener("click", (event) => {
      const btn = event.target.closest(".modal-option");
      if (!btn || !mergeSourceCard) return;
      const targetCol = btn.dataset.targetCol;
      const targetCard = document.querySelector(`.card[data-col="${targetCol}"]`);
      if (!targetCard) return;

      const sourceTiles = getTiles(mergeSourceCard);
      const targetTiles = getTiles(targetCard);

      updateCard(targetCard, clamp(targetTiles + sourceTiles + 1));
      updateCard(mergeSourceCard, 0);

      closeMergeModal();
    });

    mergeCancel.addEventListener("click", closeMergeModal);
    mergeModal.addEventListener("click", (event) => {
      if (event.target === mergeModal) closeMergeModal();
    });

    render();
  </script>
</body>
</html>
